<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fbff">
  <meta name="description" content="FLOW — your time, in motion. A calendar without the calendar.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FLOW">
  <title>FLOW · Your time, in motion</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <header class="topbar">
      <button class="wordmark" id="brand" type="button" aria-label="FLOW home"><span class="logo-mark" aria-hidden="true">∿</span><span>flow<span class="brand-dot">.</span></span></button>
      <div class="topbar-actions">
        <button type="button" class="icon-button" id="search-button" aria-label="Search events" title="Search events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
        <button type="button" class="icon-button add-button" id="add-button" aria-label="Create event" title="Create event"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 4v16M4 12h16"></path></svg></button>
      </div>
    </header>
    <main id="screen" tabindex="-1" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Primary navigation">
      <button class="tab active" data-view="flow" aria-current="page"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1 1-10 6-11 5-1 3 11 10 9"/><path d="m17 13 3 3-3 3"/></svg></span><span>Flow</span></button>
      <button class="tab" data-view="orbit"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-30 12 12)"/><circle cx="12" cy="12" r="2.7" fill="currentColor" stroke="none"/></svg></span><span>Orbit</span></button>
      <button class="tab" data-view="space"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11.5" cy="12" r="3.3"/><circle cx="4.5" cy="5" r="1.2"/><circle cx="19.5" cy="6.5" r="1.2"/><circle cx="18.5" cy="19" r="1.2"/><path d="m7 7 2 2M15 10l3-2M14 15l3 3"/></svg></span><span>Space</span></button>
      <button class="tab" data-view="settings"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.5 12a7.5 7.5 0 0 0-.13-1.36l2-1.56-2-3.46-2.38.96a7.6 7.6 0 0 0-2.36-1.38L14.25 2h-4.5l-.38 3.2A7.6 7.6 0 0 0 7 6.58l-2.38-.96-2 3.46 2 1.56a7.5 7.5 0 0 0 0 2.72l-2 1.56 2 3.46L7 17.42a7.6 7.6 0 0 0 2.36 1.38l.38 3.2h4.5l.38-3.2A7.6 7.6 0 0 0 17 17.42l2.38.96 2-3.46-2-1.56c.08-.45.12-.91.12-1.36Z"/></svg></span><span>Settings</span></button>
    </nav>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <dialog id="sheet" class="sheet"><div id="sheet-content"></div></dialog>
  </div>
</body>
</html>
