<!doctype html>
<html lang="en">

  <div class="grain"></div>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-emblem" aria-hidden="true"><span>S</span></div>
        <div class="brand-text"><strong>SOVEREIGN</strong><small>PRIVATE COMMAND</small></div>
      </div>
      <div class="side-rule"><span>THE HEADQUARTERS</span><span class="rule-line"></span></div>
      <nav class="side-nav">
        <button class="nav-item active" data-nav="briefing"><svg><use href="#i-grid"/></svg><span>Briefing</span><i>01</i></button>
        <button class="nav-item" data-nav="timeline"><svg><use href="#i-calendar"/></svg><span>Timeline</span><i>02</i></button>
        <button class="nav-item" data-nav="missions"><svg><use href="#i-target"/></svg><span>Missions</span><i>03</i></button>
        <button class="nav-item" data-nav="people"><svg><use href="#i-users"/></svg><span>People</span><i>04</i></button>
        <button class="nav-item" data-nav="intelligence"><svg><use href="#i-chart"/></svg><span>Intelligence</span><i>05</i></button>
        <button class="nav-item" data-nav="focus"><svg><use href="#i-focus"/></svg><span>Focus protocol</span><i>06</i></button>
      </nav>
      <div class="side-spacer"></div>
      <div class="sidebar-bottom">
        <div class="operator"><span class="operator-avatar">LK</span><div><div class="small-overline">YOUR SPACE</div><strong id="operator-name">Luka</strong></div><span class="operator-online" aria-label="Available"></span></div>
        <button class="nav-item settings-entry" data-nav="settings"><svg><use href="#i-settings"/></svg><span>Settings & privacy</span><i></i></button>
        <div class="side-foot">EST. 2026 <span>© SOVEREIGN</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><span class="status-dot"></span><span class="eyebrow topbar-label" id="topbar-section">DAILY BRIEFING</span><span class="topbar-sep">/</span><span id="topbar-date" class="topbar-date"></span></div>
        <div class="topbar-right"><span class="local-pill"><svg><use href="#i-lock"/></svg> PRIVATE ON THIS DEVICE</span><button id="discreet-toggle" class="icon-btn" title="Toggle discreet mode" aria-label="Toggle discreet mode"><svg><use href="#i-eye"/></svg></button><button class="icon-btn" data-nav="settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-nav="briefing"><svg><use href="#i-grid"/></svg><span>Briefing</span></button>
    <button class="mobile-nav-item" data-nav="timeline"><svg><use href="#i-calendar"/></svg><span>Timeline</span></button>
    <button class="mobile-nav-item" data-nav="missions"><svg><use href="#i-target"/></svg><span>Missions</span></button>
    <button class="mobile-nav-item" data-nav="people"><svg><use href="#i-users"/></svg><span>People</span></button>
    <button class="mobile-nav-item" data-nav="focus"><svg><use href="#i-focus"/></svg><span>Focus</span></button>
  </nav>
  <button class="q-fab" id="q-fab" aria-label="Open Q command assistant"><svg><use href="#i-spark"/></svg><span>ASK Q</span><kbd>⌘K</kbd></button>
  <div class="modal-overlay" id="modal-overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Sovereign dialog"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-json" accept="application/json,.json" hidden />
  <input type="file" id="import-ics" accept="text/calendar,.ics" hidden />
  <script src="./app.js" defer></script>
</body>
</html>
