<html lang="en">

<style>

*{box-sizing:border-box}

body{margin:0;min-height:100%;background:radial-gradient(ellipse at 20% 15%,#f3f0e9,#d8d1c4 80%)}

/* walnut-colored, stitched, 2011-inspired header */

.leather:after{content:"";pointer-events:none;position:absolute;inset:6px 6px 6px;border:1px dashed rgba(248,208,144,.34);border-radius:10px}
.leather-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:37px;height:37px;border:1px solid #dfc28a;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#eac98d,#a97c39 70%);box-shadow:inset 0 1px 2px #fff5,0 2px 4px #0006;color:#493323;font-family:Georgia,serif;font-size:26px;text-shadow:0 1px #fffc}
.brand-name{font-family:Georgia,"Times New Roman",serif;letter-spacing:.11em;font-size:17px;font-weight:bold}.brand-kicker{font-size:9px;letter-spacing:.2em;color:#e4ca9c;margin-top:4px}
.circle-tool{border:1px solid rgba(238,211,166,.55);color:#f7e7ce;width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#805c45,#4a3027);box-shadow:inset 0 1px 1px #ffffff35,0 2px 4px #0004}
.circle-tool svg{width:18px;height:18px}
.hero-date{position:relative;z-index:1;margin:27px 3px 12px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.hero-date .eyebrow{color:#dfc292}
.hero-date h1{margin:8px 0 0;font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:37px;letter-spacing:-.035em;line-height:1.1;color:#fff9f0}
.live-time{text-align:right;padding-bottom:3px}.live-time strong{font-size:15px;letter-spacing:.06em;font-weight:600}.live-time small{display:block;color:#d8b78e;font-size:10px;margin-top:4px;letter-spacing:.04em}
.leather-divider{height:5px;background:linear-gradient(#b08b60,#d6bc89 40%,#786042);box-shadow:0 2px 3px #57432b3d}
.paper{background:radial-gradient(circle at 14% 9%,rgba(255,255,255,.8),transparent 47%),repeating-linear-gradient(0deg,rgba(102,78,45,.014),rgba(102,78,45,.014) 1px,transparent 1px,transparent 4px),var(--paper)}
.main-content{min-height:calc(100dvh - 150px);padding-bottom:calc(105px + env(safe-area-inset-bottom,0px))}
.week-rail{display:flex;align-items:center;gap:4px;margin:17px 15px 18px;padding:5px;background:linear-gradient(#f6f1e6,#e6dece);border:1px solid #d4c7b4;border-radius:13px;box-shadow:inset 0 2px 5px #765c3216,0 1px #fffe}
.week-arrow{flex:0 0 24px;width:24px;height:40px;border:0;background:none;color:#917f69;display:grid;place-items:center}.week-arrow svg{width:16px;height:16px}
.week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1;gap:2px;min-width:0}.day-chip{height:58px;min-width:0;border:1px solid transparent;border-radius:9px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a736a;gap:5px;position:relative}
.day-chip .weekday{font-size:9px;letter-spacing:.07em;font-weight:700}.day-chip .day-number{font-family:Georgia,serif;font-size:19px;line-height:1}.day-chip.is-selected{background:linear-gradient(#78503a,#452a22);color:#fff2db;border:1px solid #3a211c;box-shadow:inset 0 1px 0 #fffa,0 2px 4px #0003}.day-chip.today:not(.is-selected) .day-number{color:var(--red);font-weight:bold}.day-chip.has-events:after{content:"";position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--gold)}.day-chip.is-selected.has-events:after{background:#f6dba2}
.page-padding{padding:0 20px}.section-label{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px}.section-label h2{margin:0;font-family:Georgia,serif;font-size:23px;font-weight:normal;letter-spacing:-.035em}.section-label .eyebrow{color:#b38c56;font-size:9px}.subtle-text{font-size:11px;color:var(--muted)}
.focus-preview{position:relative;border-radius:17px;background:linear-gradient(135deg,#fffaf1 0%,#f1e6d6 100%);border:1px solid #d7c4a8;box-shadow:var(--shadow),inset 0 1px #fff;padding:16px 17px 17px;overflow:hidden}
.focus-preview:before{content:"";position:absolute;top:0;bottom:0;left:0;width:5px;background:linear-gradient(var(--red),#d59a7e)}
.focus-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.focus-tag{font-size:10px;letter-spacing:.16em;color:#a16d52;font-weight:800}.pill{display:inline-flex;align-items:center;border-radius:40px;border:1px solid #d3b991;background:linear-gradient(#fffcf7,#ede0ca);box-shadow:inset 0 1px #fff;padding:5px 10px;font-size:10px;font-weight:700;color:#8f673c;letter-spacing:.03em;white-space:nowrap}

.rhythm-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:26px}.rhythm-bar .section-label{margin:0}.progress-chip{font-size:11px;display:flex;align-items:center;gap:7px;color:#887664}.progress-ring{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--sage) var(--progress,0%),#e2d8c8 0)}.progress-ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--paper)}
.segmented{display:flex;gap:3px;margin:15px 0 15px;padding:4px;background:#e8dfd0;border-radius:10px;border:1px solid #d6cab7;box-shadow:inset 0 2px 3px #6b503312}.segmented button{flex:1;background:transparent;border:1px solid transparent;padding:8px 4px;border-radius:8px;color:#897c6d;font-size:11px;font-weight:800;letter-spacing:.025em}.segmented button.active{background:linear-gradient(#fffefb,#f2ebdf);border-color:#d6c8b5;color:#624d3b;box-shadow:0 1px 3px #49361f22}
.period-heading{display:flex;align-items:center;gap:8px;margin:20px 0 10px;color:#988570}.period-heading span{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.period-heading:after{content:"";height:1px;background:linear-gradient(#dcd0c0,#e7ded1);flex:1}.period-heading svg{height:14px;width:14px;color:#a78c64}
.event-list{position:relative}.event-item{display:flex;gap:9px;position:relative;margin-bottom:11px}.event-time{flex:0 0 49px;font-size:11px;color:#8e8171;text-align:right;padding-top:15px;font-weight:750;letter-spacing:-.025em}.event-time small{display:block;margin-top:4px;font-size:9px;font-weight:400}.timeline{width:10px;display:flex;flex-direction:column;align-items:center;padding-top:16px}.timeline-dot{height:10px;width:10px;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--dot-color,#b48f65);border-radius:50%;background:var(--dot-color,#b48f65);z-index:1}.timeline-stem{width:1px;flex:1;background:#d9c9b7;margin-top:4px}.event-card{position:relative;min-width:0;flex:1;text-align:left;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fffcf6,#f6eee2);border:1px solid #ded2c0;box-shadow:0 2px 5px #55402810,inset 0 1px 0 #fff;border-radius:12px;padding:14px 11px 14px 13px;color:var(--ink)}.event-card:active{transform:translateY(1px)}.event-card.done{opacity:.59}.event-card.done .event-title{text-decoration:line-through;text-decoration-color:#8e867b}.event-card-main{flex:1;min-width:0}.event-title{font-family:Georgia,serif;font-size:16px;font-weight:normal;overflow-wrap:anywhere;line-height:1.2}.event-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:#8b8278;font-size:10px;margin-top:7px}.tiny-dot{width:5px;height:5px;background:var(--dot-color,#ad8b61);border-radius:50%;display:inline-block}.event-note{font-size:11px;margin-top:8px;color:#8b7b6b;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.check-circle{flex:0 0 28px;height:28px;border-radius:50%;border:1px solid #cbbfac;color:#a39077;background:linear-gradient(#fffcf8,#ede5da);display:grid;place-items:center;box-shadow:inset 0 1px #fff}.check-circle svg{width:14px;height:14px}.check-circle.checked{color:#fff;background:linear-gradient(#90a994,#5d8065);border-color:#57725e}
.empty-state{border:1px dashed #d6c6b2;background:#f5eee1a8;border-radius:14px;text-align:center;padding:35px 20px;color:#847362}.empty-state .empty-symbol{font-family:Georgia,serif;color:#b28d56;font-size:41px}.empty-state h3{font-family:Georgia,serif;color:#5c4d3d;font-size:20px;font-weight:normal;margin:7px 0}.empty-state p{font-size:12px;line-height:1.6;margin:0 0 14px}
.end-mark{text-align:center;margin:25px 0 13px;font-family:Georgia,serif;font-size:14px;color:#b9a181;letter-spacing:.1em}
.bottom-dock{position:sticky;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;gap:5px;min-height:calc(72px + env(safe-area-inset-bottom,0px));padding:9px 18px calc(8px + env(safe-area-inset-bottom,0px));margin-top:calc(-72px - env(safe-area-inset-bottom,0px));background:linear-gradient(#fefdfb 0,#ded8cf 8%,#b4afa8 52%,#d9d2c9 100%);border-top:1px solid #b7aba0;box-shadow:0 -4px 15px #5d4d3a21,inset 0 2px 0 #fff9}.dock-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:57px;min-height:47px;padding:6px 7px;background:transparent;border:1px solid transparent;color:#665e58;text-shadow:0 1px #fff9;border-radius:10px}.dock-tab svg{width:20px;height:20px}.dock-tab span{font-size:9px;font-weight:800;letter-spacing:.04em}.dock-tab.active{background:linear-gradient(#8b8178,#5c514b);border-color:#5e544d;box-shadow:inset 0 1px 4px #241b1666,0 1px 0 #fff9;color:#fff;text-shadow:0 -1px #0006}.dock-add{display:grid;place-items:center;width:55px;height:55px;border-radius:17px;background:linear-gradient(140deg,#e8c78c,#bd8b4d 67%,#936a3e);color:#422e20;border:1px solid #987345;box-shadow:inset 0 2px 2px #fff9,0 3px 7px #33221955;margin-top:-21px;transform:rotate(-3deg)}.dock-add svg{height:26px;width:26px;transform:rotate(3deg)}
/* Alternate views */
.view-intro{margin-top:18px;margin-bottom:20px}.view-intro .eyebrow{color:#ac8655}.view-intro h2{margin:6px 0 7px;font-family:Georgia,serif;font-size:34px;font-weight:normal;letter-spacing:-.04em}.view-intro p{margin:0;color:#8b8175;font-size:12px;line-height:1.6}
.week-card{width:100%;display:flex;align-items:center;gap:13px;border:1px solid #dbcebb;border-radius:13px;padding:15px 14px;margin:10px 0;color:var(--ink);background:linear-gradient(120deg,#fffcf7,#f0e7d8);text-align:left;box-shadow:0 2px 5px #5540280d}.week-card.selected{border-color:#b38954;box-shadow:0 0 0 2px #d9bd8733,0 3px 8px #3b2a1b17}.week-date-badge{width:52px;min-height:58px;background:linear-gradient(#efe5d4,#dfd0b7);border:1px solid #d6c5ac;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#65513c}.week-date-badge strong{font:normal 28px Georgia,serif}.week-date-badge small{font-weight:800;font-size:9px;letter-spacing:.1em}.week-content{flex:1;min-width:0}.week-content strong{font-family:Georgia,serif;font-weight:normal;font-size:17px}.week-content p{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#857a6e;margin:6px 0 0}.mini-bars{display:flex;gap:3px;margin-top:8px}.mini-bars i{width:21px;height:3px;border-radius:2px;background:#b48a50}.mini-bars i.done{background:#74917c}.week-chevron{color:#9c8b79}.week-chevron svg{width:19px;height:19px}.week-progress{text-align:center;font-size:12px;color:#907d65;margin:17px 0}
.search-box{display:flex;align-items:center;gap:9px;background:linear-gradient(#eee6d9,#f9f4ec);border:1px solid #d3c5b3;border-radius:11px;padding:0 11px;margin:18px 0 12px;box-shadow:inset 0 2px 5px #63503b18}.search-box svg{height:18px;width:18px;color:#967f65}.search-box input{flex:1;min-width:0;background:none;border:0;padding:14px 0;outline:none;font-size:14px;color:#4b3b2b}.result-date{font-family:Georgia,serif;color:#a17e52;font-size:14px;padding:12px 0 4px;margin-top:8px}.search-result{width:100%;border:1px solid #dfd1bc;border-radius:10px;background:#fffcf7;padding:13px;margin-top:8px;display:flex;gap:11px;align-items:center;text-align:left;color:var(--ink)}.search-result .result-time{font-size:10px;min-width:54px;color:#92785e}.search-result strong{font-family:Georgia,serif;font-weight:normal;font-size:16px;flex:1}.search-result .pill{font-size:9px;padding:4px 7px}

@keyframes fade-in{from{opacity:0}to{opacity:1}}

@keyframes slide-in{from{transform:translateY(25px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-header{background:linear-gradient(#72503c,#3c2822);padding:18px 20px;color:#f7e9d2;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 2px #ffffff26;border-bottom:4px solid #be935b}.sheet-header h2{font:normal 24px Georgia,serif;margin:2px 0 0}.sheet-header .eyebrow{color:#d7b686;font-size:9px}.close-sheet{width:32px;height:32px;border:1px solid #b08a6f;border-radius:50%;background:#50372a;color:white;display:grid;place-items:center}.close-sheet svg{height:17px;width:17px}.sheet-body{padding:18px 21px 9px}.field{display:block;margin:0 0 16px}.field span{display:block;color:#907753;font-size:10px;letter-spacing:.13em;font-weight:800;text-transform:uppercase;margin:0 0 7px}.field input,.field textarea,.field select{display:block;width:100%;background:linear-gradient(#f1e9dc,#fffaf2);color:#382c24;border:1px solid #d6c6b1;border-radius:9px;padding:12px 13px;font-size:15px;min-height:44px;box-shadow:inset 0 2px 4px #4f35201a}.field textarea{min-height:78px;resize:vertical;line-height:1.5}.field select{appearance:auto}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.category-options{display:flex;flex-wrap:wrap;gap:7px}.category-option{padding:10px 11px;border:1px solid #d4c7b6;border-radius:9px;background:linear-gradient(#fffaf2,#e9ddce);font-size:11px;color:#7e6e5e;font-weight:700}.category-option.chosen{border-color:#a2773d;color:#60452d;background:linear-gradient(#ecd6ae,#dcb47b);box-shadow:inset 0 1px #fffc}

.focus-modal{text-align:center}.focus-modal .eyebrow{color:#a18055}.focus-modal h3{font:normal 23px Georgia,serif;margin:10px auto 21px;max-width:300px}.timer-disc{--angle:0deg;margin:15px auto 24px;width:212px;height:212px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#bd955c var(--angle),#d9cdbc 0);box-shadow:0 4px 15px #583f2c17}.timer-face{height:194px;width:194px;border-radius:50%;background:radial-gradient(circle at 30% 22%,#fffdf7,#ece0cf);box-shadow:inset 0 3px 10px #5c4a3326,0 2px 2px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-face strong{font-family:Georgia,serif;font-weight:normal;font-size:54px;font-variant-numeric:tabular-nums}.timer-face small{font-size:10px;color:#a48d6e;letter-spacing:.16em;font-weight:800;margin-top:3px}.focus-tip{font-size:12px;line-height:1.6;color:#8b7b67;max-width:260px;margin:19px auto}

.hidden{display:none!important}

/* A few alternate leather colors, chosen in Settings */
.theme-forest{--leather:#384c3d;--leather-2:#58705b;--leather-dark:#26392e;--gold:#b49e61}.theme-night{--leather:#343b4d;--leather-2:#576176;--leather-dark:#272d3d;--gold:#c6a16b}
/* Keep the navigation reachable while scrolling a long day. */
.bottom-dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;margin-top:0}
.toast{position:fixed;left:50%;right:auto;transform:translateX(-50%);width:min(440px,calc(100vw - 40px))}

  .bottom-dock{bottom:34px;max-width:464px;border-radius:0 0 26px 26px}

/* A full-month jump is available, but the daily rhythm remains the home screen. */

.month-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 19px;gap:9px}

.month-head h3{margin:0;font:normal 23px Georgia,serif;letter-spacing:-.03em;color:#63472e}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.month-weekday{font-size:10px;font-weight:800;color:#99816a;text-align:center;margin:3px 0 8px}
.month-spacer{min-height:43px}
.month-day{min-height:46px;border-radius:9px;background:linear-gradient(#fffaf1,#eee4d4);border:1px solid #decdb9;color:#66523f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 1px #fff}

.month-day.chosen{background:linear-gradient(#855b44,#4f3027);color:#fff9eb;border-color:#513327}
.month-day.is-today:not(.chosen){border:2px solid #bc8253}
.month-dot{height:4px;width:4px;border-radius:50%;background:#bb7b46}
.month-day.chosen .month-dot{background:#e9ce91}
.month-today{display:block;margin:22px auto 4px}
.detail-place{display:flex;gap:7px;align-items:center;font-size:13px;color:#846849;margin-top:13px}
.detail-place svg{height:16px;width:16px}

/* Google Calendar connection: warm paper and polished, 2011-era controls */
.google-connect-card{margin:0 0 16px;padding:15px;border:1px solid #dbc59f;border-radius:12px;background:linear-gradient(145deg,#fffaf0,#eee0ca);box-shadow:0 2px 10px #75552d18,inset 0 1px #fff}

.google-connect-actions button:disabled{opacity:.4;cursor:not-allowed}
.google-connect-card .fineprint{margin-bottom:0}.google-connect-card a{color:#805d36;text-decoration:underline}
.google-tag{font-weight:900;color:#4285f4;font-family:Arial,sans-serif}
.google-detail{padding:12px 0;font-size:11px;color:#7b6b5b;border-bottom:1px solid #e5d9c9}
.switch-line{display:flex;gap:9px;align-items:center;min-height:44px;font-size:13px;color:#564433;margin:5px 0 15px}
.switch-line input{appearance:auto;width:19px;height:19px;accent-color:#97734f;flex:0 0 19px}
.switch-line span{display:block}.switch-line small{display:block;color:#998874;font-size:10px;margin-top:3px}
.google-toggle{border-top:1px solid #e6d9c6;margin:20px 0 0;padding-top:16px}

    const event = getEvent(id); if (!event) return;
    const newStart = getStart(event); newStart.setMinutes(newStart.getMinutes() + delta);
    event.date = dateKey(newStart); event.start = `${pad(newStart.getHours())}:${pad(newStart.getMinutes())}`;
    if (event.googleSync && !event.googleReadOnly) event.googleDirty = true;
    saveEvents(); if (event.googleSync) void syncOneGoogleEvent(event); state.date = event.date; state.weekAnchor = startWeek(parseDate(state.date)); render(); showToast(`Moved to ${event.start}`);
  }
  function startFocus(id) {
    if (!getEvent(id)) return;
    if (!state.focus || state.focus.eventId !== id) state.focus = { eventId:id, remaining:1500, length:1500, endAt:null, running:false };
    state.modal='focus'; state.editId = id; saveFocus(); renderModal();
  }
  function remainingFocus() {
    if (!state.focus) return 0;
    return state.focus.running ? Math.max(0,Math.ceil((state.focus.endAt - Date.now())/1000)) : state.focus.remaining;
  }
  function updateTimerUI() {
    if (!state.focus) return;
    const remaining = remainingFocus();
    const text = document.getElementById('timerText');
    const disc = document.getElementById('timerDisc');
    const btn = document.getElementById('focusToggle');
    if (text) text.textContent = `${pad(Math.floor(remaining/60))}:${pad(remaining%60)}`;
    if (disc) disc.style.setProperty('--angle', `${(1-remaining/state.focus.length)*360}deg`);
    if (btn) btn.innerHTML = remaining === 0 ? `${icon('rotate')} Again` : state.focus.running ? `${icon('pause')} Pause` : `${icon('play')} ${remaining === state.focus.length ? 'Start focus' : 'Continue'}`;
    if (state.focus.running && remaining === 0) { state.focus.running=false;state.focus.endAt=null;state.focus.remaining=0;saveFocus();showToast('Focus session complete. Beautiful work!'); }
  }
  function focusToggle() {
    if (!state.focus) return;
    const remaining = remainingFocus();
    if (!remaining) { state.focus.remaining=state.focus.length; state.focus.endAt=null; state.focus.running=false; }
    else if (state.focus.running) { state.focus.remaining=remaining;state.focus.endAt=null;state.focus.running=false; }
    else { state.focus.endAt=Date.now()+remaining*1000;state.focus.running=true; }
    saveFocus(); updateTimerUI();
  }
  function download(name, content, mime) {
    const blob = new Blob([content],{type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
  const icsEscape = value => String(value).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  function exportIcs() {
    const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DAYMARK//DAYMARK PLANNER//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Daymark'];
    sortEvents(state.events).forEach(e => {
      const start=getStart(e),end=new Date(start.getTime()+e.duration*60000);
      const dt=date=>`${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}T${pad(date.getHours())}${pad(date.getMinutes())}00`;
      lines.push('BEGIN:VEVENT',`UID:${icsEscape(e.id)}@daymark.local`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART:${dt(start)}`,`DTEND:${dt(end)}`,`SUMMARY:${icsEscape(e.title)}`,`DESCRIPTION:${icsEscape(e.note)}`,`LOCATION:${icsEscape(e.location || '')}`,`CATEGORIES:${icsEscape(e.category)}`,'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    download('daymark-calendar.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');
    showToast(`${state.events.length} moments exported to calendar`);
  }
  function exportJson() {
    download('daymark-backup.json',JSON.stringify({app:'Daymark',version:1,exportedAt:new Date().toISOString(),events:sortEvents(state.events)},null,2),'application/json;charset=utf-8');
    showToast('Your backup is ready');
  }
  async function importJson(file) {
    if (!file) return;
    if (file.size > 5e6) { showToast('That file is too large (5 MB max).'); return; }
    try {
      const raw=JSON.parse(await file.text());
      if (!raw || !Array.isArray(raw.events)) throw new Error('Invalid format');
      const events=raw.events.map(validEvent).filter(Boolean);
      if (!events.length && raw.events.length) throw new Error('No valid events');
      const ids = new Set(state.events.map(e => e.id));
      let count=0;
      for (const evt of events) { if (ids.has(evt.id)) evt.id=uid(); evt.googleSync=false; evt.googleEventId='';evt.googleDirty=false;state.events.push(evt);ids.add(evt.id);count++; }
      saveEvents();closeModal();render();showToast(`${count} moments added from backup`);
    } catch { showToast('Could not read this backup. Use Daymark JSON.'); }
  }
  function handleAction(action, el) {
    const id=el.dataset.id;
    switch(action) {
      case 'open-month':state.calendarMonth=new Date(parseDate(state.date).getFullYear(),parseDate(state.date).getMonth(),1,12);state.modal='month';renderModal();break;
      case 'month-prev':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()-1,1,12);renderModal();break;
      case 'month-next':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()+1,1,12);renderModal();break;
      case 'month-day':{const d=el.dataset.date;closeModal();updateSelectedDate(d);break;}
      case 'month-today':closeModal();updateSelectedDate(dateKey(new Date()));break;
      case 'settings': state.modal='settings';renderModal();break;
      case 'close': closeModal();break;
      case 'add': openEditor();break;
      case 'category': state.selectedCategory=el.dataset.value;document.getElementById('categoryInput').value=state.selectedCategory;document.querySelectorAll('.category-option').forEach(btn=>{const picked=btn.dataset.value===state.selectedCategory;btn.classList.toggle('chosen',picked);btn.setAttribute('aria-pressed',String(picked));});break;
      case 'tab':state.tab=el.dataset.value;closeModal();render();break;
      case 'today':updateSelectedDate(dateKey(new Date()));break;
      case 'select-date':updateSelectedDate(el.dataset.date);break;
      case 'open-day':updateSelectedDate(el.dataset.date);break;
      case 'week-prev':state.weekAnchor=addDays(state.weekAnchor,-7);render();break;
      case 'week-next':state.weekAnchor=addDays(state.weekAnchor,7);render();break;
      case 'filter':state.filter=el.dataset.value;render();break;
      case 'details':state.editId=id;state.modal='details';renderModal();break;
      case 'edit':if(getEvent(id)?.googleReadOnly){showToast('Edit this multi-day event in Google Calendar');break;}openEditor(id);break;
      case 'toggle-done':{const e=getEvent(id);if(!e)return;e.done=!e.done;saveEvents();if(state.modal==='details')closeModal();render();showToast(e.done?'Another moment, beautifully done':'Moved back to your to-do list');break;}
      case 'delete':{const e=getEvent(id);if(!e)return;if(!confirm(`Delete “${e.title}”${e.googleSync && e.googleEventId ? ' from Daymark and Google Calendar' : ''}?`))return;state.events=state.events.filter(v=>v.id!==id);saveEvents();closeModal();render();if(e.googleSync && e.googleEventId)void removeGoogleEvent(e);else showToast('Moment deleted');break;}
      case 'move':if(!getEvent(state.editId)?.googleReadOnly)moveEvent(state.editId,+el.dataset.delta);else showToast('Edit multi-day events in Google Calendar');break;
      case 'start-focus':startFocus(id);break;
      case 'focus-toggle':focusToggle();break;
      case 'focus-reset':if(state.focus){state.focus.remaining=state.focus.length;state.focus.running=false;state.focus.endAt=null;saveFocus();updateTimerUI();}break;
      case 'export-ics':exportIcs();break;
      case 'export-json':exportJson();break;
      case 'import':document.getElementById('importFile')?.click();break;
      case 'google-connect':connectGoogle();break;
      case 'google-sync':void syncGoogle();break;
      case 'google-disconnect':disconnectGoogle();break;
      case 'reset-demo':if(confirm('Replace all existing plans with the sample plans?')){state.events=makeDemo();saveEvents();state.date=dateKey(new Date());state.weekAnchor=startWeek(new Date());state.tab='day';closeModal();render();showToast('Sample plans restored');}break;
      case 'clear-all':if(confirm('Clear the events stored in Daymark on this phone? Your Google Calendar will NOT be erased; Google events return on the next sync.')){state.events=[];saveEvents();closeModal();render();showToast('Your calendar is now clear');}break;
    }
  }
  app.addEventListener('click',event=>{
    if(event.target.classList.contains('overlay')){closeModal();return;}
    const el=event.target.closest('[data-action]');if(el){event.preventDefault();handleAction(el.dataset.action,el);}
  });
  app.addEventListener('submit',event=>{
    if(event.target.id!=='eventForm')return;
    event.preventDefault();const data=new FormData(event.target);
    const date=String(data.get('date')),start=data.has('allDay') ? '00:00' : String(data.get('start'));
    const previous=state.editId ? getEvent(state.editId) : null;
    const linked = data.has('googleSync') && (googleConnected() || previous?.googleSync);
    const e=validEvent({ id:state.editId||uid(),title:data.get('title'),date,start,duration:data.has('allDay') ? 1440 : data.get('duration'),category:data.get('category'),note:data.get('note'),location:data.get('location'),done:previous?.done || false,allDay:data.has('allDay'),googleSync:linked,googleEventId:linked ? previous?.googleEventId : '',googleDirty:linked,googleReadOnly:false });
    if(!e){showToast('Check the title, date, time, and duration.');return;}
    const previousId=state.editId;
    // Switching off Google sync unlinks this local copy without deleting its remote counterpart.
    if (previous?.googleSync && !linked) showToast('This copy is now local-only; the original stays in Google Calendar');
    if(previousId){state.events=state.events.map(item=>item.id===previousId?e:item);}else{state.events.push(e);}
    state.date=e.date;state.weekAnchor=startWeek(parseDate(e.date));state.tab='day';state.filter='all';saveEvents();closeModal();render();showToast(linked ? googleConnected() ? 'Saved locally · syncing with Google…' : 'Saved offline · reconnect to sync with Google' : previousId?'Moment updated':'A new moment, beautifully planned');if(linked)void syncOneGoogleEvent(e);
  });
  app.addEventListener('input',event=>{if(event.target.id==='searchInput'){state.searchQuery=event.target.value;document.getElementById('searchResults').innerHTML=searchResults();}});
  app.addEventListener('change',event=>{
    if(event.target.id==='themeSelect'){state.theme=event.target.value;savePrefs();app.className=`app-frame theme-${state.theme}`;}
    if(event.target.id==='importFile')importJson(event.target.files?.[0]);
    if(event.target.id==='allDayInput'){document.getElementById('timedFields').style.display=event.target.checked?'none':'';}
    if(event.target.id==='googleClientId'){state.googleClientId=event.target.value.trim();saveGoogleConfig();googleClient=null;googleClientFor='';}
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal)closeModal();if((event.ctrlKey||event.metaKey)&&event.key==='k'){event.preventDefault();state.tab='find';closeModal();render();document.getElementById('searchInput')?.focus();}});
  let touchX=0,touchY=0;
  app.addEventListener('touchstart',event=>{if(state.tab!=='day'||state.modal)return;touchX=event.touches[0].clientX;touchY=event.touches[0].clientY;},{passive:true});
  app.addEventListener('touchend',event=>{if(state.tab!=='day'||state.modal||!touchX)return;const dx=event.changedTouches[0].clientX-touchX,dy=event.changedTouches[0].clientY-touchY;touchX=0;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5)updateSelectedDate(dateKey(addDays(parseDate(state.date),dx<0?1:-1)));},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden && googleConnected() && Date.now()-googleLastSync>2*60*1000)void syncGoogle({silent:true});});
  setInterval(()=>{if(!document.hidden && googleConnected() && Date.now()-googleLastSync>5*60*1000)void syncGoogle({silent:true});},5*60*1000);
  setInterval(()=>{const clock=document.getElementById('liveClock');if(clock)clock.textContent=clockText();if(state.focus?.running)updateTimerUI();},1000);
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();

</script>
</body>
